name: Feature request
description: An idea for VEXT
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then your idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like VEXT to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you handle it today
  - type: markdown
    attributes:
      value: VEXT never changes files without a confirm step. Ideas that touch files should say how that confirm would work.
