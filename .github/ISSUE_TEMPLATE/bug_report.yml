name: Bug report
description: Something in VEXT doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: VEXT version
      description: Shown in the About window, or in the installer's file name.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Installer (setup.exe), Portable folder, Built from source]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: textarea
    id: logs
    attributes:
      label: Log or error text
      description: The Log section in VEXT, or a plugin's failure report. Remove paths that include your user name if you prefer.
      render: text
  - type: input
    id: plugin
    attributes:
      label: Plugin (if it involves one)
      description: Name, vendor, format (VST3, VST2, CLAP...), 32 or 64-bit.
